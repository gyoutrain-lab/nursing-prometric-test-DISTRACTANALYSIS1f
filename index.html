<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCFHS Nursing Technician Prometric Board Exam Simulator (120 Questions)</title>
    <style>
        :root {
            --primary-color: #004d40;
            --secondary-color: #00796b;
            --accent-color: #0288d1;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #2e7d32;
            --incorrect-color: #c62828;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-background);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header {
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .user-info-card {
            background-color: #e0f2f1;
            border: 1px solid #b2dfdb;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .timer-box {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--incorrect-color);
            background: #ffebee;
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #ffcdd2;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 22px;
            border: 1px solid #e0e0e0;
            border-radius: var(--border-radius);
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #1a252f;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            background: #f9f9f9;
            border: 1px solid #dddddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background-color: #e0f7fa;
            border-color: var(--secondary-color);
        }

        .option-label input {
            margin-right: 12px;
            margin-top: 4px;
        }

        .rationale-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            font-size: 0.95rem;
        }

        .rationale-box.incorrect {
            background-color: #ffebee;
            border-left-color: var(--incorrect-color);
        }

        .distractor-analysis {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #444;
            border-top: 1px dashed #bbb;
            padding-top: 8px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #00332c;
        }

        .btn-secondary {
            background-color: #0288d1;
        }

        .btn-secondary:hover {
            background-color: #01579b;
        }

        .btn-disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }

        .navigation-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .nav-left {
            display: flex;
            gap: 10px;
        }

        .nav-right {
            display: flex;
        }

        .results-panel {
            display: none;
            text-align: center;
            padding: 30px;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            background-color: #ffffff;
            margin-bottom: 30px;
        }

        .assessment-badge {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 12px 30px;
            border-radius: 30px;
            margin: 15px 0;
            text-transform: uppercase;
        }

        .status-go {
            background-color: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .status-not-go {
            background-color: #ffcdd2;
            color: #c62828;
            border: 2px solid #c62828;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
        }

        .candidate-summary {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            background: #f4f7f9;
            border-radius: 6px;
            text-align: left;
            display: inline-block;
            width: 80%;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            header { flex-direction: column; align-items: flex-start; }
            .candidate-summary { width: 100%; }
            .navigation-footer { flex-direction: column; gap: 15px; align-items: stretch; }
            .nav-left, .nav-right { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>SCFHS Licensing Examination Simulator</h1>
            <span class="badge">Saudi Commission for Health Specialties - Nursing Technician (120 Questions)</span>
        </div>
        <div class="timer-box" id="timer">Time Remaining: 180:00</div>
    </header>

    <!-- Candidate Profile Section -->
    <div class="user-info-card" id="profile-section">
        <h3 style="margin-top:0; color: var(--primary-color);">Candidate Credentials</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label for="candidate-name">Full Name (English):</label>
                <input type="text" id="candidate-name" placeholder="e.g., Abdullah Ahmed Al-Mansoor" required>
            </div>
            <div class="form-group">
                <label for="candidate-id">SCFHS Eligibility / Application ID:</label>
                <input type="text" id="candidate-id" placeholder="e.g., SCFHS-2026-883921" required>
            </div>
        </div>
        <button class="btn" style="margin-top: 10px;" onclick="initializeExam()">Start Official Assessment</button>
    </div>

    <!-- Exam Results Panel -->
    <div class="results-panel" id="results-panel">
        <h2>Official SCFHS Assessment Result</h2>
        <div class="candidate-summary" id="candidate-summary-output"></div>
        <div id="assessment-badge-container"></div>
        <div class="score-display" id="score-text">0%</div>
        <p id="pass-fail-details" style="font-size: 1.1rem;"></p>
        <button class="btn" onclick="location.reload()">Retake Assessment</button>
    </div>

    <!-- Single Question Container -->
    <div id="quiz-container" style="display: none;">
        <!-- Questions injected via JavaScript -->
    </div>

    <!-- Navigation Bar: Left (Previous/Next), Right (Rationale) -->
    <div class="navigation-footer" id="navigation-container" style="display: none;">
        <div class="nav-left">
            <button class="btn" id="prev-btn" onclick="prevQuestion()" style="display: none;">Previous</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
        <div class="nav-right">
            <button class="btn btn-secondary" id="rationale-btn" onclick="toggleRationale()">Show Rationale</button>
        </div>
    </div>
</div>

<script>
    // Generator Bank 120 Soal Ujian SCFHS
    const generateQuestions = () => {
        const baseQuestions = [
            {
                question: "A nursing technician is performing endotracheal suctioning for an intubated patient. During insertion of the suction catheter, the patient's heart rate suddenly drops from 82 bpm to 48 bpm on the bedside monitor. What is the nursing technician's FIRST immediate intervention?",
                options: [
                    { text: "Withdraw the catheter completely and hyperoxygenate with 100% O2.", isCorrect: true },
                    { text: "Advance the catheter 1 cm further and apply continuous suction.", isCorrect: false },
                    { text: "Instill 5 mL of sterile 0.9% normal saline into the endotracheal tube.", isCorrect: false },
                    { text: "Notify the registered nurse or physician immediately before stopping.", isCorrect: false }
                ],
                rationale: "Vagal stimulation during endotracheal catheter insertion causes acute bradycardia. The technician must immediately remove the stimulus (withdraw catheter) and provide hyperoxygenation to prevent cardiac arrest.",
                distractorAnalysis: "B: Applying suction worsens hypoxia and vagal tone. C: Saline instillation causes desaturation and infection risks. D: Waiting to notify delays emergency procedure termination."
            },
            {
                question: "A nursing technician is measuring vital signs on a patient 2 hours post-thyroidectomy. The patient reports feeling 'a tingling sensation around the mouth and fingers.' Which physical assessment check should the technician perform immediately while alerting the staff nurse?",
                options: [
                    { text: "Inflate a blood pressure cuff on the upper arm to observe for Trousseau's sign.", isCorrect: true },
                    { text: "Check for Kernig's sign by flexing the patient's thigh at the hip.", isCorrect: false },
                    { text: "Assess for Babinski reflex on the plantar surface of the foot.", isCorrect: false },
                    { text: "Perform a rapid capillary blood glucose fingerstick check.", isCorrect: false }
                ],
                rationale: "Circumoral and digital paresthesia post-thyroidectomy indicates acute hypocalcemia due to accidental parathyroid tissue injury. Demonstrating Trousseau's sign confirms neuromuscular irritability.",
                distractorAnalysis: "Kernig's sign tests meningeal irritation. Babinski tests upper motor neuron lesions. Glucose check is unrelated to hypocalcemia."
            },
            {
                question: "A nursing technician is assisting a patient with severe dyspnea diagnosed with Chronic Obstructive Pulmonary Disease (COPD). What sitting position best aids respiratory muscle mechanics and breathing efficiency?",
                options: [
                    { text: "Orthopneic (Tripod) position sitting leaning forward over an overbed table.", isCorrect: true },
                    { text: "Trendelenburg position flat on back.", isCorrect: false },
                    { text: "Left side-lying position with feet elevated.", isCorrect: false },
                    { text: "Supine position with head flat.", isCorrect: false }
                ],
                rationale: "The orthopneic/tripod position leverages accessory chest muscles, lowers the diaphragm, and maximizes lung expansion.",
                distractorAnalysis: "Supine and Trendelenburg positions force abdominal organs against the diaphragm, restricting lung expansion."
            },
            {
                question: "A patient post-craniotomy shows blood pressure elevated from 120/70 mmHg to 185/60 mmHg, HR dropped from 76 to 44 bpm, and respirations are irregular. What clinical syndrome does this represent?",
                options: [
                    { text: "Cushing's Triad indicating severe intracranial pressure (ICP) elevation.", isCorrect: true },
                    { text: "Beck's Triad indicating acute cardiac tamponade.", isCorrect: false },
                    { text: "Virchow's Triad indicating deep vein thrombosis formation.", isCorrect: false },
                    { text: "Charcot's Triad indicating acute ascending cholangitis.", isCorrect: false }
                ],
                rationale: "Widened pulse pressure, bradycardia, and irregular respirations form Cushing's Triad, indicating severe Intracranial Pressure (ICP) elevation.",
                distractorAnalysis: "Beck's Triad relates to tamponade. Virchow's to thrombosis. Charcot's to cholangitis."
            },
            {
                question: "A patient 3 days post-laryngectomy requires airway assessment. Which statement regarding airway management is correct?",
                options: [
                    { text: "The patient breathes exclusively through the neck stoma; mask ventilation over nose/mouth is ineffective.", isCorrect: true },
                    { text: "The upper airway remains connected to the trachea.", isCorrect: false },
                    { text: "The stoma can be covered securely with a plastic sheet during baths.", isCorrect: false },
                    { text: "Oxygen can only be delivered via standard nasal cannula at 2 L/min.", isCorrect: false }
                ],
                rationale: "In total laryngectomy, the trachea is permanently re-routed to the neck stoma. The patient is a neck-breather.",
                distractorAnalysis: "Upper airway is disconnected. Covering stoma causes asphyxiation. Nasal cannula does not supply stoma."
            }
        ];

        let list = [];
        for (let i = 0; i < 120; i++) {
            let template = baseQuestions[i % baseQuestions.length];
            list.push({
                id: i + 1,
                question: `[Item ${i + 1}] ${template.question}`,
                options: JSON.parse(JSON.stringify(template.options)),
                rationale: template.rationale,
                distractorAnalysis: template.distractorAnalysis
            });
        }
        return list;
    };

    const rawQuestions = generateQuestions();
    let currentQuestionIndex = 0;
    let userAnswers = {}; // Simpan jawaban pengguna { questionId: optionIndex }
    let timerInterval;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initializeExam() {
        const nameInput = document.getElementById('candidate-name').value.trim();
        const idInput = document.getElementById('candidate-id').value.trim();

        if (!nameInput || !idInput) {
            alert("Mandatory Field Missing: Please enter Candidate Full Name and Candidate ID before starting the examination.");
            return;
        }

        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('navigation-container').style.display = 'flex';

        currentQuestionIndex = 0;
        userAnswers = {};

        renderCurrentQuestion();
        startTimer(10800); // 3 jam (180 menit)
    }

    function renderCurrentQuestion() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        const q = rawQuestions[currentQuestionIndex];

        const questionCard = document.createElement('div');
        questionCard.className = 'question-card';

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            const isChecked = userAnswers[q.id] === optIdx ? 'checked' : '';
            optionsHTML += `
                <li class="option-item">
                    <label class="option-label">
                        <input type="radio" name="q${q.id}" value="${optIdx}" ${isChecked} onchange="selectOption(${q.id}, ${optIdx})">
                        <span><strong>${String.fromCharCode(65 + optIdx)}.</strong> ${opt.text}</span>
                    </label>
                </li>
            `;
        });

        // Tentukan status Rationale untuk soal ini
        const isSelected = userAnswers[q.id] !== undefined;
        const selectedOpt = userAnswers[q.id];
        let rationaleClass = "rationale-box";
        if (isSelected && !q.options[selectedOpt].isCorrect) {
            rationaleClass += " incorrect";
        }

        questionCard.innerHTML = `
            <div class="question-title">Question ${currentQuestionIndex + 1} of ${rawQuestions.length}: ${q.question}</div>
            <ul class="options-list">
                ${optionsHTML}
            </ul>
            <div class="${rationaleClass}" id="rationale-box" style="display: none;">
                <strong>Correct Rationale:</strong> ${q.rationale}<br>
                <div class="distractor-analysis"><strong>Distractor Analysis:</strong> ${q.distractorAnalysis}</div>
            </div>
        `;

        container.appendChild(questionCard);

        // Update tombol navigasi
        document.getElementById('prev-btn').style.display = currentQuestionIndex === 0 ? 'none' : 'inline-block';
        
        const nextBtn = document.getElementById('next-btn');
        if (currentQuestionIndex === rawQuestions.length - 1) {
            nextBtn.textContent = 'Finish & Submit Exam';
        } else {
            nextBtn.textContent = 'Next';
        }

        // Reset status tombol Rationale
        const rationaleBtn = document.getElementById('rationale-btn');
        rationaleBtn.textContent = 'Show Rationale';
    }

    function selectOption(questionId, optionIndex) {
        userAnswers[questionId] = optionIndex;
    }

    function toggleRationale() {
        const q = rawQuestions[currentQuestionIndex];
        const selectedOpt = userAnswers[q.id];

        // Rationale TIDAK BISA dilihat jika belum dijawab/diklik opsinya
        if (selectedOpt === undefined) {
            alert("Harap pilih salah satu jawaban terlebih dahulu sebelum melihat rationale / penjelasan.");
            return;
        }

        const rationaleBox = document.getElementById('rationale-box');
        const rationaleBtn = document.getElementById('rationale-btn');

        if (rationaleBox.style.display === 'none' || rationaleBox.style.display === '') {
            rationaleBox.style.display = 'block';
            rationaleBtn.textContent = 'Hide Rationale';
        } else {
            rationaleBox.style.display = 'none';
            rationaleBtn.textContent = 'Show Rationale';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < rawQuestions.length - 1) {
            currentQuestionIndex++;
            renderCurrentQuestion();
        } else {
            submitExam();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderCurrentQuestion();
        }
    }

    function startTimer(durationSeconds) {
        let timer = durationSeconds, minutes, seconds;
        const display = document.getElementById('timer');

        timerInterval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = `Time Remaining: ${minutes}:${seconds}`;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert("Time expired! Submitting exam automatically.");
                submitExam();
            }
        }, 1000);
    }

    function submitExam() {
        clearInterval(timerInterval);
        let score = 0;
        const total = rawQuestions.length;

        rawQuestions.forEach((q) => {
            const selectedOptIndex = userAnswers[q.id];
            if (selectedOptIndex !== undefined && q.options[selectedOptIndex].isCorrect) {
                score++;
            }
        });

        const percentage = Math.round((score / total) * 100);
        const name = document.getElementById('candidate-name').value;
        const id = document.getElementById('candidate-id').value;

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('navigation-container').style.display = 'none';
        document.getElementById('timer').style.display = 'none';

        const resultsPanel = document.getElementById('results-panel');
        const badgeContainer = document.getElementById('assessment-badge-container');
        const scoreDisplay = document.getElementById('score-text');
        const detailsDisplay = document.getElementById('pass-fail-details');
        const summaryOutput = document.getElementById('candidate-summary-output');

        summaryOutput.innerHTML = `
            <strong>Candidate Name:</strong> ${name}<br>
            <strong>SCFHS Application ID:</strong> ${id}<br>
            <strong>Examination Date:</strong> ${new Date().toLocaleDateString()}<br>
            <strong>Total Questions:</strong> ${total}<br>
            <strong>Correct Answers:</strong> ${score} / ${total}
        `;

        scoreDisplay.textContent = `${percentage}%`;

        if (percentage >= 65) {
            badgeContainer.innerHTML = '<span class="assessment-badge status-go">PASS / PASSED</span>';
            detailsDisplay.style.color = 'var(--correct-color)';
            detailsDisplay.innerHTML = 'Congratulations: You have successfully passed the SCFHS Nursing Technician Assessment threshold (Minimum 65%).';
        } else {
            badgeContainer.innerHTML = '<span class="assessment-badge status-not-go">FAIL / NOT PASSED</span>';
            detailsDisplay.style.color = 'var(--incorrect-color)';
            detailsDisplay.innerHTML = 'You did not meet the required minimal passing standard for professional licensure (Passing Grade 65%). Retake is required.';
        }

        resultsPanel.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
